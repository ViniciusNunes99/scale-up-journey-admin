<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Red background -->
  <rect width="200" height="200" rx="40" fill="#E63946"/>

  <!-- M&GA Logo -->
  <g transform="translate(35, 55)">
    <!-- M -->
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="white">M</text>

    <!-- & in red box -->
    <rect x="58" y="18" width="28" height="45" fill="white" rx="3"/>
    <text x="61" y="56" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#E63946">&amp;</text>

    <!-- GA -->
    <text x="92" y="55" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="white">GA</text>
  </g>
</svg>