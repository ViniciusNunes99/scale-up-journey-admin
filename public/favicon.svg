<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Red background -->
  <rect width="200" height="200" rx="40" fill="#E63946"/>

  <!-- Assessor Logo in white -->
  <g transform="translate(20, 50)">
    <!-- Letter A with gradient effect -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">A</text>

    <!-- Number 4 (representing V4) -->
    <text x="65" y="60" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">4</text>
  </g>
</svg>