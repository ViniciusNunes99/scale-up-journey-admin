<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Red background -->
  <rect width="200" height="200" rx="40" fill="#E63946"/>

  <!-- M&GA Logo in white -->
  <g transform="translate(50, 60)">
    <!-- M -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">M</text>

    <!-- & (ampersand) in red on white background -->
    <rect x="55" y="15" width="30" height="50" fill="white" rx="4"/>
    <text x="57" y="55" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#E63946">&amp;</text>

    <!-- GA -->
    <text x="92" y="50" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">GA</text>
  </g>
</svg>